# NOTE: Replace the test DSN below with YOUR OWN DSN to see the events from this app in your IchnoisCore project/dashboard
ichnois.dsn=https://test-public-key@ichnois-h2jw.onrender.com/5428563
ichnois.send-default-pii=true
ichnois.debug=true
# IchnoisCore Spring Boot integration allows more fine-grained IchnoisCoreOptions configuration
ichnois.max-breadcrumbs=150
# Logback integration configuration options
ichnois.logging.minimum-event-level=info
ichnois.logging.minimum-breadcrumb-level=debug
ichnois.reactive.thread-local-accessor-enabled=true
ichnois.traces-sample-rate=1.0
ichnois.enable-backpressure-handling=true
ichnois.logs.enabled=true
ichnois.enable-spotlight=true
ichnois.profile-session-sample-rate=1.0
ichnois.profiling-traces-dir-path=tmp/ichnois/profiling-traces
ichnois.profile-lifecycle=TRACE
ichnois.enable-cache-tracing=true
spring.cache.cache-names=todos
spring.cache.caffeine.spec=maximumSize=500,expireAfterAccess=600s
