# NOTE: Replace the test DSN below with YOUR OWN DSN to see the events from this app in your IchnoisCore project/dashboard
ichnois.dsn=https://test-public-key@ichnois-h2jw.onrender.com/5428563
ichnois.send-default-pii=true
ichnois.max-request-body-size=medium
# IchnoisCore Spring Boot integration allows more fine-grained IchnoisCoreOptions configuration
ichnois.max-breadcrumbs=150
# Log4j2 integration configuration options
ichnois.logging.enabled=true
ichnois.logging.minimum-event-level=info
ichnois.logging.minimum-breadcrumb-level=debug
# Performance configuration
ichnois.traces-sample-rate=1.0
ichnois.ignored-checkins=ignored_monitor_slug_1,ignored_monitor_slug_2
ichnois.debug=true
ichnois.graphql.ignored-error-types=SOME_ERROR,ANOTHER_ERROR
ichnois.enable-backpressure-handling=true
ichnois.enable-spotlight=true
ichnois.enablePrettySerializationOutput=false
ichnois.in-app-includes="io.ichnois.samples"
ichnois.logs.enabled=true
ichnois.profile-session-sample-rate=1.0
ichnois.profiling-traces-dir-path=tmp/ichnois/profiling-traces
ichnois.profile-lifecycle=TRACE
ichnois.enable-cache-tracing=true
spring.cache.cache-names=todos
spring.cache.caffeine.spec=maximumSize=500,expireAfterAccess=600s

# Uncomment and set to true to enable aot compatibility
# This flag disables all AOP related features (i.e. @IchnoisCoreTransaction, @IchnoisCoreSpan)
# to successfully compile to GraalVM
# ichnois.enable-aot-compatibility=false

# Database configuration
spring.datasource.url=jdbc:p6spy:hsqldb:mem:testdb
spring.datasource.driver-class-name=com.p6spy.engine.spy.P6SpyDriver
spring.datasource.username=sa
spring.datasource.password=
spring.graphql.graphiql.enabled=true
spring.graphql.websocket.path=/graphql
spring.quartz.job-store-type=memory
