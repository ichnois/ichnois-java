minVersion: 0.29.3
changelogPolicy: auto
targets:
  - name: maven
    includeNames: /^ichnois.*$/
    gradleCliPath: ./gradlew
    mavenCliPath: scripts/mvnw
    mavenSettingsPath: scripts/settings.xml
    mavenRepoId: ossrh-staging-api
    mavenRepoUrl: https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/
    android:
      distDirRegex: /^(ichnois-android-|.*-android).*$/
      fileReplaceeRegex: /\d+\.\d+\.\d+(-\w+(\.\d+)?)?(-SNAPSHOT)?/
      fileReplacerStr: release.aar
  - name: github
    excludeNames: /^libichnois.*\.so$/
  - name: registry
    # Every package carries name/packageUrl/mainDocsUrl/apiDocsUrl so craft can create the
    # registry entry itself when we add a new artifact. Craft only reads them for a package it
    # hasn't published before, but defining them all here for conistency and 
    # as a single source of truth.
    sdks:
      maven:io.ichnois:ichnois:
        name: io.ichnois:ichnois
        packageUrl: https://central.sonatype.com/artifact/io.ichnois/ichnois
        mainDocsUrl: https://docs.sentry.io/platforms/java/
        apiDocsUrl: https://javadoc.io/doc/io.ichnois
