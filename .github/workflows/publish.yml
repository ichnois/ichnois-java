name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.0.0, leave empty for gradle.properties version)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish and Release to Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Update version if specified
        if: ${{ github.event.inputs.version != '' }}
        run: |
          sed -i 's/^versionName=.*/versionName=${{ github.event.inputs.version }}/' gradle.properties

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
        run: |
          chmod +x gradlew
          if [ -n "$SIGNING_KEY" ]; then
            export ORG_GRADLE_PROJECT_signingInMemoryKey="$SIGNING_KEY"
            if [ -z "$SIGNING_KEY_ID" ]; then
              RAW_ID=$(printf '%s\n' "$SIGNING_KEY" | gpg --show-keys --keyid-format short 2>/dev/null | grep -E '^(sec|pub)' | head -n1 | awk '{print $2}' | cut -d/ -f2)
              if [ -z "$RAW_ID" ]; then
                RAW_ID=$(printf '%s\n' "$SIGNING_KEY" | gpg --list-packets 2>/dev/null | grep -m1 -i 'keyid' | awk '{print $NF}' | tr -d '0x:')
              fi
              SIGNING_KEY_ID="$RAW_ID"
            fi
            if [ -n "$SIGNING_KEY_ID" ]; then
              CLEAN_KEY_ID=$(echo "$SIGNING_KEY_ID" | tr -d '0x' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
              SHORT_KEY_ID="${CLEAN_KEY_ID: -8}"
              export ORG_GRADLE_PROJECT_signingInMemoryKeyId="$SHORT_KEY_ID"
              echo "Configured GPG Short Key ID: $SHORT_KEY_ID"
            fi
          fi
          if [ -n "$SIGNING_PASSWORD" ]; then
            export ORG_GRADLE_PROJECT_signingInMemoryKeyPassword="$SIGNING_PASSWORD"
          fi
          ./gradlew publishToMavenCentral --no-configuration-cache --no-daemon
